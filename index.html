<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <title>Lumina | Pro Air Draw</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      /* Mature Dark Mode Palette */
      --bg-base: #09090b;
      --bg-surface: rgba(24, 24, 27, 0.7);
      --bg-surface-hover: rgba(39, 39, 42, 0.9);
      --border-light: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.2);
      
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      
      --accent-primary: #10b981; /* Emerald */
      --accent-danger: #ef4444; /* Red */
      --accent-brand: #3b82f6; /* Blue */
      
      /* Z-Index Hierarchy */
      --z-video: 1;
      --z-canvas: 2;
      --z-ui: 3;
      --z-overlay: 40;
      --z-modal: 50;
      --z-toast: 100;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: var(--bg-base); color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      touch-action: none; /* Prevent pinch-zoom and pull-to-refresh */
    }

    /* Core Layout */
    #viewport { position: absolute; inset: 0; background: var(--bg-base); }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.2; z-index: var(--z-video); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: var(--z-canvas); pointer-events: none; }
    #uiCanvas { z-index: var(--z-ui); }

    /* --- Mature UI Components --- */

    /* 1. Glassmorphic Toolbar */
    .toolbar-container {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      z-index: var(--z-overlay); width: calc(100% - 32px); max-width: 480px;
      pointer-events: none;
    }

    .glass-panel {
      background: var(--bg-surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-light); border-radius: 24px;
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      width: 100%; pointer-events: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transition: border-color 0.3s ease;
    }

    /* 2. Custom Color Palette (Replacing native input[type=color]) */
    .color-palette { display: flex; gap: 10px; }
    .color-swatch {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; transition: transform 0.2s, border-color 0.2s;
    }
    .color-swatch.active { border-color: white; transform: scale(1.15); box-shadow: 0 0 12px currentColor; }
    
    /* 3. Custom Brush Size Visualizer */
    .brush-control { display: flex; align-items: center; gap: 12px; }
    .brush-preview-container { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 50%; }
    .brush-preview { background: white; border-radius: 50%; transition: width 0.1s, height 0.1s, background-color 0.3s; }
    
    input[type="range"] {
      -webkit-appearance: none; width: 100px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--text-primary); cursor: pointer; transition: transform 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }

    /* Action Buttons */
    .btn-icon {
      background: transparent; border: none; color: var(--text-secondary);
      width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-icon:hover { color: var(--text-primary); background: var(--bg-surface-hover); }
    .btn-icon:active { transform: scale(0.95); }
    .btn-icon.danger:hover { color: var(--accent-danger); background: rgba(239, 68, 68, 0.1); }

    /* 4. Status Pill */
    .status-pill {
      background: var(--bg-surface); backdrop-filter: blur(10px); border: 1px solid var(--border-light);
      padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px;
      display: flex; align-items: center; gap: 8px; pointer-events: auto; text-transform: uppercase;
      color: var(--text-secondary); transition: all 0.3s ease;
    }
    .status-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); transition: background 0.3s; }

    /* 5. Toast Notification System */
    #toast-container {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; gap: 8px; z-index: var(--z-toast); pointer-events: none;
    }
    .toast {
      background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(12px); border: 1px solid var(--border-light);
      padding: 12px 20px; border-radius: 12px; color: white; font-size: 0.9rem; font-weight: 500;
      display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: toastSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .toast.hide { animation: toastSlideOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .toast-icon { font-size: 1.2rem; }
    .toast.success .toast-icon { color: var(--accent-primary); }
    .toast.error .toast-icon { color: var(--accent-danger); }
    .toast.info .toast-icon { color: var(--accent-brand); }

    @keyframes toastSlideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes toastSlideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-20px); opacity: 0; } }

    /* 6. Professional Modal / Overlay System */
    .overlay-backdrop {
      position: fixed; inset: 0; background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(8px);
      z-index: var(--z-modal); display: flex; align-items: center; justify-content: center;
      padding: 20px; transition: opacity 0.4s ease, visibility 0.4s;
    }
    .overlay-backdrop.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    
    .modal-card {
      background: #18181b; border: 1px solid var(--border-light); border-radius: 24px;
      padding: 32px; max-width: 420px; width: 100%; text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: translateY(0) scale(1); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .overlay-backdrop.hidden .modal-card { transform: translateY(20px) scale(0.95); }

    .modal-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
    .modal-desc { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; }
    
    .gesture-guide { display: grid; gap: 16px; margin-bottom: 32px; text-align: left; }
    .guide-item { display: flex; align-items: center; gap: 16px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 12px; }
    .guide-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }

    .btn-primary {
      width: 100%; background: var(--text-primary); color: var(--bg-base); border: none;
      padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-progress; }

    /* Loading Spinner */
    .spinner {
      width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.1); border-top-color: currentColor;
      border-radius: 50%; animation: spin 1s linear infinite; display: none;
    }
    .btn-primary.loading .spinner { display: block; }
    .btn-primary.loading .material-symbols-outlined { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 600px) {
      .glass-panel { padding: 10px 14px; flex-direction: column; gap: 12px; border-radius: 20px; }
      .toolbar-container { bottom: 16px; }
      .panel-row { display: flex; width: 100%; justify-content: space-between; align-items: center; }
      input[type="range"] { width: 120px; }
    }
    @media (min-width: 601px) {
      .panel-row { display: contents; } /* Flattens the layout on desktop */
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="overlay-backdrop" id="startupModal">
    <div class="modal-card">
      <h1 class="modal-title">Lumina Pro</h1>
      <p class="modal-desc">AI-powered air drawing requires camera access. Processing happens entirely on your device.</p>
      
      <div class="gesture-guide" id="guideContent">
        <div class="guide-item">
          <div class="guide-icon" style="color: var(--accent-primary)"><span class="material-symbols-outlined">touch_app</span></div>
          <div><div style="font-weight: 600; font-size: 0.95rem">Draw</div><div style="font-size: 0.85rem; color: var(--text-secondary)">Raise index finger</div></div>
        </div>
        <div class="guide-item">
          <div class="guide-icon" style="color: var(--accent-danger)"><span class="material-symbols-outlined">back_hand</span></div>
          <div><div style="font-weight: 600; font-size: 0.95rem">Erase</div><div style="font-size: 0.85rem; color: var(--text-secondary)">Open palm flat</div></div>
        </div>
        <div class="guide-item">
          <div class="guide-icon" style="color: var(--text-secondary)"><span class="material-symbols-outlined">front_hand</span></div>
          <div><div style="font-weight: 600; font-size: 0.95rem">Hover / Pause</div><div style="font-size: 0.85rem; color: var(--text-secondary)">Close fist</div></div>
        </div>
      </div>

      <button id="startBtn" class="btn-primary" disabled>
        <div class="spinner"></div>
        <span class="material-symbols-outlined">camera</span>
        <span id="startText">Loading AI Models...</span>
      </button>
    </div>
  </div>

  <div id="viewport">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="paintCanvas"></canvas>
    <canvas id="uiCanvas"></canvas>
  </div>

  <div class="toolbar-container">
    <div class="status-pill" id="statusBadge">
      <div class="status-indicator" id="statusDot"></div>
      <span id="statusText">Awaiting input</span>
    </div>

    <div class="glass-panel">
      <div class="panel-row">
        <div class="color-palette" id="colorPalette">
          <div class="color-swatch active" style="background: #00ffcc; color: #00ffcc;" data-color="#00ffcc"></div>
          <div class="color-swatch" style="background: #fbbf24; color: #fbbf24;" data-color="#fbbf24"></div>
          <div class="color-swatch" style="background: #f43f5e; color: #f43f5e;" data-color="#f43f5e"></div>
          <div class="color-swatch" style="background: #a855f7; color: #a855f7;" data-color="#a855f7"></div>
          <div class="color-swatch" style="background: #ffffff; color: #ffffff;" data-color="#ffffff"></div>
        </div>
      </div>
      
      <div class="panel-row">
        <div class="brush-control">
          <div class="brush-preview-container">
            <div class="brush-preview" id="brushPreview" style="width: 12px; height: 12px; background: #00ffcc;"></div>
          </div>
          <input type="range" id="brushSlider" min="4" max="50" value="12">
        </div>

        <div style="display: flex; gap: 8px;">
          <button class="btn-icon" id="saveBtn" title="Export Artwork">
            <span class="material-symbols-outlined">download</span>
          </button>
          <button class="btn-icon danger" id="clearBtn" title="Clear Canvas">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * UI Responses Manager - Handles Toasts and Modals
     * Provides mature feedback mechanisms instead of raw alerts.
     */
    class UIResponses {
      static showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        let icon = 'info';
        if (type === 'success') icon = 'check_circle';
        if (type === 'error') icon = 'error';

        toast.innerHTML = `
          <span class="material-symbols-outlined toast-icon">${icon}</span>
          <span>${message}</span>
        `;
        
        container.appendChild(toast);

        // Auto remove
        setTimeout(() => {
          toast.classList.add('hide');
          toast.addEventListener('animationend', () => toast.remove());
        }, 3000);
      }

      static showErrorModal(title, message) {
        document.getElementById('startupModal').classList.remove('hidden');
        document.getElementById('guideContent').style.display = 'none';
        document.querySelector('.modal-title').innerText = title;
        document.querySelector('.modal-desc').innerText = message;
        
        const btn = document.getElementById('startBtn');
        btn.innerHTML = '<span class="material-symbols-outlined">refresh</span> Retry';
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.onclick = () => window.location.reload();
      }
    }

    /**
     * Lumina Pro App Controller
     */
    class LuminaApp {
      constructor() {
        // Core elements
        this.video = document.getElementById('webcam');
        this.paintCanvas = document.getElementById('paintCanvas');
        this.uiCanvas = document.getElementById('uiCanvas');
        this.ctx = this.paintCanvas.getContext('2d', { willReadFrequently: true });
        this.uiCtx = this.uiCanvas.getContext('2d');
        
        // UI Elements
        this.startupModal = document.getElementById('startupModal');
        this.startBtn = document.getElementById('startBtn');
        this.brushSlider = document.getElementById('brushSlider');
        this.brushPreview = document.getElementById('brushPreview');
        this.colorSwatches = document.querySelectorAll('.color-swatch');
        
        // Status Elements
        this.statusBadge = document.getElementById('statusBadge');
        this.statusDot = document.getElementById('statusDot');
        this.statusText = document.getElementById('statusText');

        // State
        this.currentColor = '#00ffcc';
        this.currentSize = 12;
        this.mode = 'IDLE';
        this.pointer = { x: null, y: null };
        this.smoothed = { x: null, y: null };
        this.lastDrawn = { x: null, y: null };
        this.lerpFactor = 0.45; 

        this.initEventListeners();
        this.initAI();
      }

      initEventListeners() {
        window.addEventListener('resize', () => this.handleResize());
        
        // Custom Color Palette Logic
        this.colorSwatches.forEach(swatch => {
          swatch.addEventListener('click', (e) => {
            this.colorSwatches.forEach(s => s.classList.remove('active'));
            e.target.classList.add('active');
            this.currentColor = e.target.dataset.color;
            this.brushPreview.style.backgroundColor = this.currentColor;
            if (this.mode === 'DRAW') this.updateStatusUI();
          });
        });

        // Brush Visualizer Logic
        this.brushSlider.addEventListener('input', (e) => {
          this.currentSize = parseInt(e.target.value);
          this.brushPreview.style.width = `${this.currentSize}px`;
          this.brushPreview.style.height = `${this.currentSize}px`;
        });

        // Action Buttons
        document.getElementById('clearBtn').addEventListener('click', () => {
          this.ctx.clearRect(0, 0, this.paintCanvas.width, this.paintCanvas.height);
          UIResponses.showToast('Canvas cleared', 'info');
        });

        document.getElementById('saveBtn').addEventListener('click', () => this.exportCanvas());
        
        this.startBtn.addEventListener('click', () => this.requestCamera());
      }

      handleResize() {
        const vWidth = this.video.videoWidth || 640;
        const vHeight = this.video.videoHeight || 480;
        const wWidth = window.innerWidth;
        const wHeight = window.innerHeight;
        
        const scale = Math.max(wWidth / vWidth, wHeight / vHeight);
        
        // Save current stroke buffer
        const temp = document.createElement('canvas');
        temp.width = this.paintCanvas.width; temp.height = this.paintCanvas.height;
        if(this.paintCanvas.width > 0) temp.getContext('2d').drawImage(this.paintCanvas, 0, 0);

        this.paintCanvas.width = this.uiCanvas.width = wWidth;
        this.paintCanvas.height = this.uiCanvas.height = wHeight;
        
        this.ctx.drawImage(temp, 0, 0);
        
        this.vidScale = scale;
        this.vidOffsetX = (vWidth * scale - wWidth) / 2;
        this.vidOffsetY = (vHeight * scale - wHeight) / 2;
      }

      async initAI() {
        try {
          this.hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
          this.hands.setOptions({
            maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.6
          });
          this.hands.onResults((res) => this.onAIResults(res));
          
          await this.hands.initialize();
          
          // Ready to start
          this.startBtn.disabled = false;
          this.startBtn.querySelector('#startText').innerText = "Launch Camera";
        } catch (e) {
          UIResponses.showErrorModal("Initialization Failed", "Could not load AI models. Please check your internet connection.");
        }
      }

      async requestCamera() {
        this.startBtn.classList.add('loading');
        this.startBtn.querySelector('#startText').innerText = "Connecting...";

        try {
          // Explicit permission check for mature error handling
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 } } });
          this.video.srcObject = stream;
          
          this.camera = new Camera(this.video, {
            onFrame: async () => { await this.hands.send({ image: this.video }); },
            width: 1280, height: 720
          });

          await this.camera.start();
          this.video.addEventListener('loadedmetadata', () => {
            this.handleResize();
            this.startupModal.classList.add('hidden');
            UIResponses.showToast('Camera active. Ready to draw!', 'success');
            requestAnimationFrame(() => this.render());
          });

        } catch (err) {
          console.error(err);
          let msg = "Please allow camera access in your browser settings to use this app.";
          if (err.name === 'NotAllowedError') msg = "Camera a
            UIResponses.showErrorModal("Camera Error", msg);
        }
      }

      // Math
      dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }
      lerp(a, b, t) { return a + (b - a) * t; }

      analyzeHand(marks) {
        const wrist = marks[0];
        const isUp = (tip, pip) => (this.dist(marks[tip], wrist) / this.dist(marks[pip], wrist)) > 1.25;

        const fingers = [isUp(8,6), isUp(12,10), isUp(16,14), isUp(20,18)];
        
        if (fingers.every(f => f)) return 'ERASE';
        if (fingers[0] && !fingers[1] && !fingers[2] && !fingers[3]) return 'DRAW';
        return 'PAUSE';
      }

      updateStatusUI() {
        const configs = {
          'DRAW': { text: 'Drawing', color: this.currentColor, border: this.currentColor },
          'ERASE': { text: 'Erasing', color: 'var(--accent-danger)', border: 'var(--accent-danger)' },
          'PAUSE': { text: 'Hovering', color: 'var(--text-primary)', border: 'var(--border-focus)' },
          'IDLE': { text: 'Hand not found', color: 'var(--text-secondary)', border: 'transparent' }
        };
        
        const conf = configs[this.mode];
        this.statusText.innerText = conf.text;
        this.statusDot.style.background = conf.color;
        this.statusBadge.style.borderColor = conf.border;
        this.statusBadge.style.boxShadow = this.mode === 'DRAW' ? `0 0 10px ${this.currentColor}40` : 'none';
      }

      onAIResults(results) {
        if (!results.multiHandLandmarks?.length) {
          if (this.mode !== 'IDLE') {
            this.mode = 'IDLE';
            this.pointer = { x: null, y: null };
            this.smoothed = { x: null, y: null };
            this.updateStatusUI();
          }
          return;
        }

        const marks = results.multiHandLandmarks[0];
        const newMode = this.analyzeHand(marks);
        
        if (newMode !== this.mode) {
          this.mode = newMode;
          this.updateStatusUI();
        }

        // Map normalized coords (mirrored) to screen space using cover scale maths
        const rawX = 1 - marks[8].x;
        const rawY = marks[8].y;
        
        this.pointer.x = (rawX * this.video.videoWidth * this.vidScale) - this.vidOffsetX;
        this.pointer.y = (rawY * this.video.videoHeight * this.vidScale) - this.vidOffsetY;

        if (this.smoothed.x === null) {
          this.smoothed = { ...this.pointer };
          this.lastDrawn = { ...this.pointer };
        }
      }

      render() {
        this.uiCtx.clearRect(0, 0, this.uiCanvas.width, this.uiCanvas.height);

        if (this.pointer.x !== null) {
          this.smoothed.x = this.lerp(this.smoothed.x, this.pointer.x, this.lerpFactor);
          this.smoothed.y = this.lerp(this.smoothed.y, this.pointer.y, this.lerpFactor);

          const size = this.currentSize;

          if (this.mode === 'DRAW') {
            this.ctx.globalCompositeOperation = 'source-over';
            this.ctx.strokeStyle = this.currentColor;
            this.ctx.lineWidth = size;
            this.ctx.lineCap = 'round';
            this.ctx.lineJoin = 'round';
            this.ctx.shadowBlur = size * 1.5;
            this.ctx.shadowColor = this.currentColor;

            this.ctx.beginPath();
            this.ctx.moveTo(this.lastDrawn.x, this.lastDrawn.y);
            this.ctx.lineTo(this.smoothed.x, this.smoothed.y);
            this.ctx.stroke();

            // UI Cursor (Solid ring)
            this.uiCtx.beginPath();
            this.uiCtx.arc(this.smoothed.x, this.smoothed.y, size/2 + 3, 0, Math.PI*2);
            this.uiCtx.strokeStyle = '#fff';
            this.uiCtx.lineWidth = 2;
            this.uiCtx.stroke();

          } else if (this.mode === 'ERASE') {
            this.ctx.globalCompositeOperation = 'destination-out';
            this.ctx.lineWidth = size * 4; 
            this.ctx.lineCap = 'round';
            this.ctx.lineJoin = 'round';
            this.ctx.shadowBlur = 0;

            this.ctx.beginPath();
            this.ctx.moveTo(this.lastDrawn.x, this.lastDrawn.y);
            this.ctx.lineTo(this.smoothed.x, this.smoothed.y);
            this.ctx.stroke();

            // Eraser Cursor (Dashed red ring)
            this.uiCtx.beginPath();
            this.uiCtx.arc(this.smoothed.x, this.smoothed.y, (size*4)/2, 0, Math.PI*2);
            this.uiCtx.strokeStyle = 'var(--accent-danger)';
            this.uiCtx.lineWidth = 2;
            this.uiCtx.setLineDash([6, 6]);
            this.uiCtx.stroke();
            this.uiCtx.setLineDash([]);

          } else if (this.mode === 'PAUSE') {
            // Hover Cursor
            this.uiCtx.beginPath();
            this.uiCtx.arc(this.smoothed.x, this.smoothed.y, 5, 0, Math.PI*2);
            this.uiCtx.fillStyle = 'rgba(255,255,255,0.6)';
            this.uiCtx.fill();
          }

          this.lastDrawn = { ...this.smoothed };
        }

        requestAnimationFrame(() => this.render());
      }

      exportCanvas() {
        try {
          const exp = document.createElement('canvas');
          exp.width = this.paintCanvas.width; exp.height = this.paintCanvas.height;
          const eCtx = exp.getContext('2d');
          
          eCtx.fillStyle = '#09090b'; // Export with dark background
          eCtx.fillRect(0, 0, exp.width, exp.height);
          eCtx.drawImage(this.paintCanvas, 0, 0);

          const link = document.createElement('a');
          link.download = `lumina-export-${Date.now()}.png`;
          link.href = exp.toDataURL('image/png');
          link.click();
          UIResponses.showToast('Artwork saved to your device', 'success');
        } catch (e) {
          UIResponses.showToast('Failed to save artwork', 'error');
        }
      }
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => new LuminaApp());
  </script>
</body>
</html>
