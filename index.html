<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Air Draw</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --neon-glow: #00ffcc;
      --bg-dark: #0a0a12;
      --panel-bg: rgba(15, 15, 25, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Main Container to maintain consistent layout */
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Wrapper that scales nicely based on camera feed aspect ratio */
    .viewport-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    /* Mirrored camera feed in background */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.25;
      z-index: 1;
      pointer-events: none;
    }

    /* Drawing and UI interaction layer canvases */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #paintCanvas { z-index: 2; }
    #uiCanvas { z-index: 3; pointer-events: none; }

    /* Control Panel UI Layout */
    .control-panel {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 90px;
      background: rgba(255,255,255,0.2);
      height: 6px;
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .btn-clear {
      background: rgba(255, 75, 75, 0.2);
      border: 1px solid rgba(255, 75, 75, 0.4);
      color: #ff4b4b;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-clear:active {
      background: rgba(255, 75, 75, 0.4);
    }

    /* Status HUD Bar */
    .status-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.05);
      color: #aaa;
      transition: all 0.3s ease;
    }

    /* Responsive adjustments for smaller phone views */
    @media (max-width: 600px) {
      .control-panel {
        width: 90%;
        gap: 12px;
        padding: 10px;
        justify-content: space-between;
      }
      .control-group span { display: none; }
      input[type="range"] { width: 70px; }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="viewport-wrapper" id="viewport">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="paintCanvas"></canvas>
      <canvas id="uiCanvas"></canvas>

      <div class="control-panel">
        <div class="control-group">
          <span>Color:</span>
          <input type="color" id="colorPicker" value="#00ffcc">
        </div>
        <div class="control-group">
          <span>Size:</span>
          <input type="range" id="brushSlider" min="4" max="40" value="12">
        </div>
        <button class="btn-clear" id="clearBtn">Clear</button>
      </div>

      <div class="status-bar" id="statusBar">Initializing Camera...</div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const paintCanvas = document.getElementById('paintCanvas');
    const uiCanvas = document.getElementById('uiCanvas');
    const viewport = document.getElementById('viewport');
    
    const ctx = paintCanvas.getContext('2d');
    const uiCtx = uiCanvas.getContext('2d');
    
    const colorPicker = document.getElementById('colorPicker');
    const brushSlider = document.getElementById('brushSlider');
    const clearBtn = document.getElementById('clearBtn');
    const statusBar = document.getElementById('statusBar');

    let prevX = null;
    let prevY = null;
    let isTracking = false;

    // Dynamically scale canvas layers to fit the loaded video aspect stream layout safely
    function resizeCanvas() {
      const vWidth = video.videoWidth || 640;
      const vHeight = video.videoHeight || 480;
      
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      
      let targetWidth = windowWidth;
      let targetHeight = (vHeight / vWidth) * windowWidth;
      
      if (targetHeight > windowHeight) {
        targetHeight = windowHeight;
        targetWidth = (vWidth / vHeight) * windowHeight;
      }
      
      viewport.style.width = `${targetWidth}px`;
      viewport.style.height = `${targetHeight}px`;

      // Save drawing layer data safely across temporary viewport resizing shifts
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = paintCanvas.width;
      tempCanvas.height = paintCanvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      if (paintCanvas.width > 0 && paintCanvas.height > 0) {
        tempCtx.drawImage(paintCanvas, 0, 0);
      }

      paintCanvas.width = targetWidth;
      paintCanvas.height = targetHeight;
      uiCanvas.width = targetWidth;
      uiCanvas.height = targetHeight;

      // Restore drawing layer
      ctx.drawImage(tempCanvas, 0, 0, paintCanvas.width, paintCanvas.height);
    }

    video.addEventListener('loadedmetadata', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    // Calculate Euclidean distance between two coordinate landmarks
    function getDistance(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // Process hand array and return target application gesture state modes
    function detectGesture(landmarks) {
      const wrist = landmarks[0];
      
      // Determine if regular fingers are extended vs curled up based on distance profiles
      const indexExtended = getDistance(landmarks[8], wrist) > getDistance(landmarks[6], wrist);
      const middleExtended = getDistance(landmarks[12], wrist) > getDistance(landmarks[10], wrist);
      const ringExtended = getDistance(landmarks[16], wrist) > getDistance(landmarks[14], wrist);
      const pinkyExtended = getDistance(landmarks[20], wrist) > getDistance(landmarks[18], wrist);

      // Open Palm Check (Erase Mode)
      if (indexExtended && middleExtended && ringExtended && pinkyExtended) {
        return 'ERASE';
      }
      // Index Pointing Check Only (Draw Mode)
      if (indexExtended && !middleExtended && !ringExtended && !pinkyExtended) {
        return 'DRAW';
      }
      // Fist Check (Pause Mode)
      if (!indexExtended && !middleExtended && !ringExtended && !pinkyExtended) {
        return 'PAUSE';
      }
      
      return 'PAUSE'; 
    }

    function updateStatusUI(mode) {
      statusBar.innerText = `Mode: ${mode}`;
      if (mode === 'DRAW') {
        statusBar.style.color = colorPicker.value;
        statusBar.style.textShadow = `0 0 8px ${colorPicker.value}`;
      } else if (mode === 'ERASE') {
        statusBar.style.color = '#ff3366';
        statusBar.style.textShadow = '0 0 8px #ff3366';
      } else {
        statusBar.style.color = '#888';
        statusBar.style.textShadow = 'none';
      }
    }

    function onResults(results) {
      uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const mode = detectGesture(landmarks);
        updateStatusUI(mode);

        // Convert MediaPipe space coords into canvas screen system mapping
        // Coordinate inverted across horizontal axis due to mirrored canvas standard view logic
        const rawX = 1 - landmarks[8].x; 
        const rawY = landmarks[8].y;
        
        const x = rawX * paintCanvas.width;
        const y = rawY * paintCanvas.height;

        const currentBrushColor = colorPicker.value;
        const currentBrushSize = parseInt(brushSlider.value);

        if (mode === 'DRAW') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = currentBrushColor;
          ctx.lineWidth = currentBrushSize;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Inject standard neon glow blending attributes inside canvas pipeline 
          ctx.shadowBlur = currentBrushSize * 1.2;
          ctx.shadowColor = currentBrushColor;

          if (prevX !== null && prevY !== null) {
            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(x, y);
            ctx.stroke();
          }
          prevX = x;
          prevY = y;

          // Draw neon tracking crosshair circle on dynamic UI context layer
          uiCtx.beginPath();
          uiCtx.arc(x, y, currentBrushSize / 2 + 4, 0, 2 * Math.PI);
          uiCtx.strokeStyle = '#fff';
          uiCtx.lineWidth = 2;
          uiCtx.stroke();

        } else if (mode === 'ERASE') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = currentBrushSize * 2.5; 
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.shadowBlur = 0; // Prevent background context corruption layers 

          if (prevX !== null && prevY !== null) {
            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(x, y);
            ctx.stroke();
          }
          prevX = x;
          prevY = y;

          // Draw an outer boundary circle representation indicating system is erasing 
          uiCtx.beginPath();
          uiCtx.arc(x, y, (currentBrushSize * 2.5) / 2, 0, 2 * Math.PI);
          uiCtx.strokeStyle = '#ff3366';
          uiCtx.lineWidth = 1.5;
          uiCtx.setLineDash([4, 4]); // Dashed indicator loop
          uiCtx.stroke();
          uiCtx.setLineDash([]); // Reset line styles safely

        } else {
          // Reset stroke tracking anchors safely upon system pause state triggers
          prevX = null;
          prevY = null;

          // Soft tracking cursor indicator for Pause state
          uiCtx.beginPath();
          uiCtx.arc(x, y, 6, 0, 2 * Math.PI);
          uiCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          uiCtx.fill();
        }
      } else {
        prevX = null;
        prevY = null;
        statusBar.innerText = "No Hand Detected";
        statusBar.style.color = '#555';
        statusBar.style.textShadow = 'none';
      }
    }

    // MediaPipe Object Initialization Architecture
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    // Initialize Lightweight MediaPipe Camera Utility System Instance
    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 640,
      height: 480,
      facingMode: "user" // Defaults cleanly directly onto front-facing smartphone camera streams
    });

    camera.start()
      .then(() => {
        statusBar.innerText = "Ready. Raise your hand!";
        resizeCanvas();
      })
      .catch(err => {
        statusBar.innerText = "Camera Access Denied";
        console.error(err);
      });

    // Clear Button listener Action
    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
    });
  </script>
</body>
</html>
